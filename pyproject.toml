[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-compact"
version = "0.2.0"
description = "Local code compaction for LLM prompts, with token counting."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["tiktoken>=0.14,<0.15"]

[project.optional-dependencies]
ui = ["streamlit>=1.64,<1.65"]
dev = ["pytest>=9.1,<10", "ruff>=0.16,<0.17", "build>=1.6,<2"]

[tool.setuptools.packages.find]
include = ["llm_compact*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
